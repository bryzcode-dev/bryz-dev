<style>
  :root {
    color-scheme: dark;
    --canvas: #0b0f14;
    --surface: #131a23;
    --surface-raised: #192330;
    --border: #2d3a4a;
    --text: #f4f7fb;
    --muted: #a8b3c2;
    --cobalt: #4d8dff;
    --cobalt-ink: #07111f;
    --teal: #40d6bd;
    --amber: #f4bc55;
    --red: #ff6b78;
    --radius: 14px;
    --shadow: 0 18px 50px rgba(0, 0, 0, .28);
  }
  * { box-sizing: border-box; }
  html { background: var(--canvas); color: var(--text); font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { min-width: 320px; min-height: 100vh; margin: 0; background: radial-gradient(circle at 80% -20%, rgba(77,141,255,.16), transparent 34rem), var(--canvas); }
  button, input, select, textarea { color: inherit; font: inherit; }
  button, input, select { min-height: 44px; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .skip-link { position: fixed; z-index: 20; top: 10px; left: 10px; transform: translateY(-150%); padding: 10px 14px; border-radius: 8px; background: var(--cobalt); color: var(--cobalt-ink); font-weight: 800; }
  .skip-link:focus { transform: translateY(0); }
  .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 76px; padding: 14px clamp(18px, 4vw, 52px); border-bottom: 1px solid var(--border); background: rgba(11,15,20,.88); backdrop-filter: blur(18px); }
  .brand { display: flex; gap: 12px; align-items: center; color: var(--text); text-decoration: none; }
  .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 12px; background: linear-gradient(145deg, var(--cobalt), var(--teal)); color: var(--cobalt-ink); font-weight: 900; }
  .brand strong, .brand small { display: block; }
  .brand small { color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .topbar-status { display: flex; gap: 9px; align-items: center; color: var(--muted); }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 14px rgba(64,214,189,.7); }
  .role-badge, .count-badge, .chip { display: inline-flex; align-items: center; min-height: 28px; padding: 3px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase; }
  .primary-nav { display: flex; gap: 4px; overflow-x: auto; padding: 10px clamp(18px, 4vw, 52px); border-bottom: 1px solid var(--border); background: var(--surface); }
  .nav-item { min-width: 96px; padding: 8px 16px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 750; }
  .nav-item:hover { background: var(--surface-raised); color: var(--text); }
  .nav-item.is-active { background: rgba(77,141,255,.14); color: #9fc0ff; }
  .state-banner { margin: 18px clamp(18px, 4vw, 52px) 0; padding: 13px 16px; border: 1px solid var(--border); border-left: 4px solid var(--amber); border-radius: 10px; background: var(--surface); }
  .state-banner strong { display: block; }
  .state-banner p { margin: 2px 0 0; color: var(--muted); }
  .state-banner[data-tone="danger"] { border-left-color: var(--red); }
  .state-banner[data-tone="success"] { border-left-color: var(--teal); }
  .workspace { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(360px, .92fr); gap: 22px; max-width: 1480px; min-height: calc(100vh - 190px); margin: 0 auto; padding: 28px clamp(18px, 4vw, 52px); }
  .project-browser, .project-detail { min-width: 0; }
  .project-detail { align-self: start; position: sticky; top: 20px; padding: 24px; border: 1px solid var(--border); border-radius: var(--radius); background: linear-gradient(155deg, rgba(25,35,48,.98), rgba(19,26,35,.98)); box-shadow: var(--shadow); }
  .section-heading, .dialog-heading, .detail-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  h1, h2, h3, p { margin-top: 0; }
  h1 { margin-bottom: 0; font-size: clamp(28px, 3vw, 42px); letter-spacing: -.04em; }
  h2 { margin-bottom: 8px; letter-spacing: -.02em; }
  .eyebrow { margin-bottom: 4px; color: var(--teal); font-size: 11px; font-weight: 850; letter-spacing: .14em; text-transform: uppercase; }
  .controls { display: grid; grid-template-columns: minmax(180px, 1fr) 150px; gap: 12px; margin: 22px 0 14px; }
  .field label { display: block; margin: 0 0 6px; color: var(--muted); font-size: 13px; font-weight: 700; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 10px 12px; }
  .field textarea { resize: vertical; }
  .project-list { display: grid; gap: 10px; }
  .project-card { width: 100%; padding: 17px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); text-align: left; transition: border-color .18s ease, transform .18s ease, background .18s ease; }
  .project-card:hover { transform: translateY(-1px); border-color: #53709a; background: var(--surface-raised); }
  .project-card[aria-pressed="true"] { border-color: var(--cobalt); background: rgba(77,141,255,.1); }
  .project-card strong { display: block; margin-bottom: 7px; font-size: 17px; }
  .project-meta { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip.public { color: #8fe8d6; }
  .chip.private { color: #ffd586; }
  .empty-list, .empty-detail { padding: 28px 6px; color: var(--muted); text-align: center; }
  .detail-description { color: var(--muted); }
  .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 22px 0; }
  .datum { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: rgba(11,15,20,.35); }
  .datum span, .datum strong { display: block; }
  .datum span { color: var(--muted); font-size: 12px; }
  .connections { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
  .connection-item { padding: 10px 0; color: var(--muted); border-bottom: 1px solid rgba(45,58,74,.55); }
  .looker-panel { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--border); }
  .looker-state { margin: 12px 0; padding: 14px; border: 1px solid var(--border); border-left: 4px solid var(--amber); border-radius: 10px; background: rgba(11,15,20,.35); }
  .looker-state p { margin: 3px 0 0; color: var(--muted); }
  .looker-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0; }
  .looker-status-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
  .looker-status-grid h3 { grid-column: 1 / -1; }
  .looker-section, .looker-owner-panel { margin-top: 22px; }
  .looker-table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  .looker-table-wrap table { width: 100%; min-width: 560px; border-collapse: collapse; }
  .looker-table-wrap th, .looker-table-wrap td { padding: 11px 12px; border-bottom: 1px solid var(--border); text-align: left; }
  .looker-table-wrap th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .looker-action { display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .looker-action span { color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .admin-card { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .button, .icon-button { border: 1px solid transparent; border-radius: 10px; padding: 9px 15px; font-weight: 800; }
  .button.primary { background: var(--cobalt); color: var(--cobalt-ink); }
  .button.secondary, .icon-button { border-color: var(--border); background: var(--surface); color: var(--text); }
  .icon-button { min-width: 44px; padding: 0; font-size: 23px; }
  footer { display: flex; justify-content: space-between; gap: 16px; padding: 15px clamp(18px, 4vw, 52px); border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  dialog { width: min(560px, calc(100vw - 28px)); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-raised); color: var(--text); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(3,7,12,.78); backdrop-filter: blur(4px); }
  dialog form { display: grid; gap: 16px; }
  #edit-help { color: var(--muted); }
  .form-error { min-height: 23px; margin: 0; color: #ff9ba4; }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; }
  .skeleton { min-height: 88px; border-radius: 12px; background: linear-gradient(90deg, var(--surface) 25%, var(--surface-raised) 50%, var(--surface) 75%); background-size: 200% 100%; animation: loading 1.4s infinite; }
  @keyframes loading { to { background-position: -200% 0; } }
  @media (max-width: 760px) {
    .topbar { align-items: flex-start; gap: 12px; }
    .topbar-status { flex-wrap: wrap; justify-content: flex-end; font-size: 12px; }
    .workspace { grid-template-columns: 1fr; padding-top: 20px; }
    .project-detail { position: static; }
    .controls { grid-template-columns: 1fr; }
    .admin-card { grid-template-columns: 1fr; }
    .looker-metrics, .looker-status-grid { grid-template-columns: 1fr; }
    .filter-field select { width: 100%; }
    footer { flex-direction: column; }
  }
  @media (max-width: 440px) {
    .brand small, #sync-summary { display: none; }
    .detail-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
